<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd06a" />
    <title>초록 생물 도감</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffe8a3'/%3E%3Cpath d='M18 40C14 26 24 14 38 14C40 28 32 40 18 40Z' fill='%235fb544'/%3E%3Ccircle cx='38' cy='38' r='11' fill='none' stroke='%23f2a522' stroke-width='4'/%3E%3Cpath d='M46 46L54 54' stroke='%238a5a3b' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body style="margin: 0; background: #fff8e7">
    <div id="root">
      <!-- 게임이 켜지면 이 안내는 자동으로 사라집니다. 켜지지 않으면 빈 화면 대신 이 안내가 보입니다. -->
      <div id="boot-msg" style="font-family: 'Malgun Gothic', sans-serif; max-width: 560px; margin: 60px auto; padding: 24px; line-height: 1.6; color: #3b2f22; text-align: center">
        <p style="font-size: 22px; font-weight: bold">🔍 초록 생물 도감을 불러오는 중이에요…</p>
        <p id="boot-help" style="display: none; font-size: 17px; text-align: left; background: #fff; border: 3px solid #f2c14e; border-radius: 16px; padding: 16px">
          게임이 켜지지 않았어요. 아래를 확인해 주세요.<br />
          ① <b>‘초록-생물-도감.html’</b> 파일(또는 <b>dist</b> 폴더 안의 index.html)을 열었는지 확인해 주세요.
          프로젝트 맨 위의 index.html 은 만들기용 원본이라 열리지 않아요.<br />
          ② 브라우저가 너무 오래된 버전이면 업데이트해 주세요.<br />
          ③ 학교 관리 설정으로 파일 속 프로그램 실행이 막혀 있을 수 있어요. 담당 선생님께 문의해 주세요.
        </p>
      </div>
    </div>
    <noscript>
      <p style="text-align: center; font-size: 18px">자바스크립트를 켜야 게임을 할 수 있어요.</p>
    </noscript>
    <script>
      // 옛 브라우저에서도 동작하는 간단한 안내 (게임이 5초 안에 켜지지 않으면 도움말 표시)
      setTimeout(function () {
        var help = document.getElementById('boot-help');
        if (help && document.getElementById('boot-msg')) help.style.display = 'block';
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
